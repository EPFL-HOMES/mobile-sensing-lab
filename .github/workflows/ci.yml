name: CI

on:
  push:
  pull_request:

jobs:
  windows-headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core Python workflow
        run: python -m pip install ".[optimization]" pytest
      - name: Check scientific imports
        run: python -c "from mobile_sensing.simulation import run_event_kernel; from mobile_sensing.portfolio import evaluate_samples; from mobile_sensing.application import HeadlessApplication"
      - name: Exercise synchronous simulation without the browser or coordinator
        run: python -m pytest -q tests/v2/test_m07_headless_application.py::test_headless_cli_validates_and_runs_without_http_or_browser
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.4.1
          poetry install --all-extras
      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
      - name: Check Python source
        run: |
          poetry run ruff check src/mobile_sensing tests/v2
          poetry run black --check src/mobile_sensing tests/v2
          poetry check --lock
      - name: Run test suites
        run: |
          poetry run pytest -q tests/v2
          npm --prefix frontend test
      - name: Build distributions
        run: poetry build
